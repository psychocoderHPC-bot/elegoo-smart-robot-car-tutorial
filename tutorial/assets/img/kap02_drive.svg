<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320">
  <style>
    text { font-family: "Atkinson Hyperlegible", sans-serif; fill: #1B1F24; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6572"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="320" fill="#FFFFFF"/>

  <rect x="20" y="120" width="150" height="80" rx="10" fill="#E8F0FA" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="95" y="152" text-anchor="middle" font-size="16">Geschwindigkeit</text>
  <text x="95" y="174" text-anchor="middle" font-size="16">−255 … 255</text>

  <path d="M170 145 L220 145 L220 70 L226 70" fill="none" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M170 175 L220 175 L220 250 L226 250" fill="none" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="230" y="40" width="170" height="60" rx="8" fill="#F5F7FA" stroke="#C25E00" stroke-width="2.5"/>
  <text x="315" y="66" text-anchor="middle" font-size="15">Vorzeichen</text>
  <text x="315" y="86" text-anchor="middle" font-size="15">+ oder −</text>

  <rect x="230" y="220" width="170" height="60" rx="8" fill="#F5F7FA" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="315" y="246" text-anchor="middle" font-size="15">Betrag</text>
  <text x="315" y="266" text-anchor="middle" font-size="15">abs(Zahl)</text>

  <line x1="400" y1="70" x2="454" y2="70" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="400" y1="250" x2="454" y2="250" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="460" y="40" width="180" height="60" rx="8" fill="#FBEEE3" stroke="#C25E00" stroke-width="2.5"/>
  <text x="550" y="66" text-anchor="middle" font-size="15">Richtungspin</text>
  <text x="550" y="86" text-anchor="middle" font-size="15">HIGH oder LOW</text>

  <rect x="460" y="220" width="180" height="60" rx="8" fill="#E9F5EA" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="550" y="246" text-anchor="middle" font-size="15">PWM-Pin</text>
  <text x="550" y="266" text-anchor="middle" font-size="15">0 … 255</text>

  <rect x="460" y="130" width="180" height="60" rx="8" fill="#F5F7FA" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="550" y="156" text-anchor="middle" font-size="15">STBY</text>
  <text x="550" y="176" text-anchor="middle" font-size="15">auf HIGH</text>

  <path d="M640 70 L670 70 L670 145 L676 145" fill="none" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M640 250 L670 250 L670 175 L676 175" fill="none" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="640" y1="160" x2="676" y2="160" stroke="#5A6572" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="682" y="115" width="86" height="92" rx="10" fill="#E8F0FA" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="725" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F5FA8">Motor</text>
  <text x="725" y="176" text-anchor="middle" font-size="15">dreht</text>
</svg>
